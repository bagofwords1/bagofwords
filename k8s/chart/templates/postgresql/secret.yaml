{{- if and (include "bowapp.postgresql.enabled" .) (empty .Values.postgresql.auth.existingSecret) }}
{{- $auth := .Values.postgresql.auth }}
{{- if or (empty $auth.username) (empty $auth.password) (empty $auth.database) }}
{{- fail "postgresql.auth.username, postgresql.auth.password and postgresql.auth.database are required for the bundled PostgreSQL (or set postgresql.auth.existingSecret, or postgresql.enabled=false for an external database)" }}
{{- end }}
{{- $name := include "bowapp.postgresql.fullname" . }}
{{- $keys := $auth.secretKeys }}
{{- /*
  The superuser password is only consumed when the data directory is first
  initialised. Reuse the stored one so a re-render (or an upgrade from the
  Bitnami subchart, which wrote the same Secret and keys) does not rotate it
  out from under the data on disk.
*/}}
{{- $adminPassword := $auth.postgresPassword }}
{{- if and (not $adminPassword) (eq $auth.username "postgres") }}
{{- $adminPassword = $auth.password }}
{{- end }}
{{- if not $adminPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (hasKey $existing.data $keys.adminPasswordKey) }}
{{- $adminPassword = index $existing.data $keys.adminPasswordKey | b64dec }}
{{- else }}
{{- $adminPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bowapp.postgresql.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $keys.userPasswordKey }}: {{ $auth.password | b64enc | quote }}
  {{ $keys.adminPasswordKey }}: {{ $adminPassword | b64enc | quote }}
{{- end }}
