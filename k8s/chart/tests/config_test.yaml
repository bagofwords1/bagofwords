suite: test configmap
templates:
  - config.yaml
release:
  name: test-release
chart:
  appVersion: 0.0.1-test
set:
  postgresql.auth.username: test
  postgresql.auth.password: test
  postgresql.auth.database: testdb
tests:
  - it: renders with default values
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: test-release
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: test-release
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: "^bagofwords-"
      - matchRegex:
          path: data.BOW_DATABASE_URL
          pattern: "^postgresql://test:test@test-release-postgresql:5432/testdb$"
      - equal:
          path: data.BOW_AUTH_MODE
          value: hybrid
      - equal:
          path: data.BOW_TELEMETRY_ENABLED
          value: "true"

  - it: points the URL at the bundled Service when the release name contains postgresql
    release:
      name: my-postgresql
    asserts:
      # The bundled Service drops the "-postgresql" suffix in that case.
      - matchRegex:
          path: data.BOW_DATABASE_URL
          pattern: "^postgresql://test:test@my-postgresql:5432/testdb$"

  - it: defaults the idle-session timeout on only for the bundled server
    asserts:
      # The bundled server is PostgreSQL 17, so the GUC is known-supported.
      - equal:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS
          value: "600000"
      # Pool geometry stays unset so the app's own defaults apply.
      - notExists:
          path: data.BOW_DB_POOL_SIZE
      - notExists:
          path: data.BOW_DB_MAX_OVERFLOW

  - it: leaves the idle-session timeout unset for an external database
    set:
      database.host: rds.example.com
    asserts:
      # idle_session_timeout is PostgreSQL 14+ and an unrecognised startup
      # parameter fails EVERY connection, so an external server of unknown
      # version must not inherit this default.
      - notExists:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS

  - it: leaves the idle-session timeout unset when the bundled server is disabled
    set:
      postgresql.enabled: false
    asserts:
      - notExists:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS

  - it: leaves the idle-session timeout unset when the URL comes from a Secret
    set:
      postgresql.auth.existingSecret: bowapp-secrets
      config.secretRef: bowapp-secrets
    asserts:
      # The documented Secret install (k8s/README.md) supplies BOW_DATABASE_URL
      # itself and is loaded after this ConfigMap via envFrom, so it can point
      # at an external server of unknown version while postgresql.enabled and
      # database.host are both still at their bundled defaults.
      - notExists:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS
      # Guard the premise: with a Secret in play the chart emits no URL of its
      # own, which is exactly why it cannot know the server version.
      - notExists:
          path: data.BOW_DATABASE_URL

  - it: leaves the idle-session timeout unset for an existingSecret alone
    set:
      postgresql.auth.existingSecret: bowapp-secrets
    asserts:
      - notExists:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS

  - it: leaves the idle-session timeout unset for a config.secretRef alone
    set:
      config.secretRef: bowapp-secrets
    asserts:
      - notExists:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS

  - it: leaves the idle-session timeout unset for an IAM-authenticated database
    set:
      database.auth.provider: aws_iam
      database.host: rds.example.com
      database.username: bow
      database.name: bow
    asserts:
      - notExists:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS

  - it: honours an explicit idle-session timeout under a Secret install
    set:
      postgresql.auth.existingSecret: bowapp-secrets
      config.secretRef: bowapp-secrets
      config.database.idleSessionTimeoutMs: 600000
    asserts:
      # However the URL is supplied, an operator who knows their server is 14+
      # can still opt in.
      - equal:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS
          value: "600000"

  - it: honours an explicit idle-session timeout on an external database
    set:
      database.host: rds.example.com
      config.database.idleSessionTimeoutMs: 600000
    asserts:
      - equal:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS
          value: "600000"

  - it: renders numeric zero rather than dropping it
    set:
      config.database.poolSize: 5
      config.database.maxOverflow: 0
      config.database.idleSessionTimeoutMs: 0
    asserts:
      - equal:
          path: data.BOW_DB_POOL_SIZE
          value: "5"
      # 0 is falsey to Helm. Dropping it would hand the backend its own default
      # of 20, allowing 25 connections per worker where 5 were asked for.
      - equal:
          path: data.BOW_DB_MAX_OVERFLOW
          value: "0"
      # Likewise 0 here means "disable reaping", not "use the default".
      - equal:
          path: data.BOW_DB_IDLE_SESSION_TIMEOUT_MS
          value: "0"

  - it: renders the database pool env when the operator sizes it
    set:
      config.database.poolSize: 10
      config.database.maxOverflow: 5
    asserts:
      - equal:
          path: data.BOW_DB_POOL_SIZE
          value: "10"
      - equal:
          path: data.BOW_DB_MAX_OVERFLOW
          value: "5"

  - it: leaves proxy trust to start.sh (loopback) unless forwardedAllowIps is set
    asserts:
      - notExists:
          path: data.FORWARDED_ALLOW_IPS

  - it: passes forwardedAllowIps through as FORWARDED_ALLOW_IPS
    set:
      config.forwardedAllowIps: "10.0.0.0/8,192.168.1.5"
    asserts:
      - equal:
          path: data.FORWARDED_ALLOW_IPS
          value: "10.0.0.0/8,192.168.1.5"

  - it: renders no multi-organization settings by default
    asserts:
      - notExists:
          path: data.BOW_SUPERUSER_EMAILS
      - notMatchRegex:
          path: data.bowConfig
          pattern: "security:"
      - notMatchRegex:
          path: data.bowConfig
          pattern: "org_mapping|trust_email_for_linking"

  - it: passes instance administrators through as BOW_SUPERUSER_EMAILS
    set:
      config.superuserEmails:
        - it-admin@example.com
        - platform@example.com
    asserts:
      - equal:
          path: data.BOW_SUPERUSER_EMAILS
          value: "it-admin@example.com,platform@example.com"

  - it: writes the security settings into bow-config as given
    set:
      config.security:
        block_private_outbound: true
        organization_file_roots:
          org-1: ["/mnt/finance"]
    asserts:
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^security:$'
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^  block_private_outbound: true$'
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^  organization_file_roots:\s+org-1:\s+- /mnt/finance$'

  - it: renders an identity provider's organization mapping in both forms
    set:
      config.oidcProviders:
        - name: entra
          issuer: https://login.example.com/tenant/v2.0
          clientId: abc
          clientSecret: "${BOW_OIDC_ENTRA_CLIENT_SECRET}"
          trustEmailForLinking: false
          orgMapping:
            - group: 5d1f8a52-0c11-4d6f-9a3e-6f0f6f1a0001
              organization: Finance
            - group: Finance Leads
              organization: Finance
              role: admin
            - "5d1f8a52-0c11-4d6f-9a3e-6f0f6f1a0002:HR:member"
    asserts:
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^    trust_email_for_linking: false$'
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^    org_mapping:\s+- group: "5d1f8a52-0c11-4d6f-9a3e-6f0f6f1a0001"\s+organization: "Finance"\s+role: "member"$'
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^      - group: "Finance Leads"\s+organization: "Finance"\s+role: "admin"$'
      - matchRegex:
          path: data.bowConfig
          pattern: '(?m)^      - "5d1f8a52-0c11-4d6f-9a3e-6f0f6f1a0002:HR:member"$'

  - it: leaves email linking to the automatic rule when it is not set
    set:
      config.oidcProviders:
        - name: okta
          issuer: https://example.okta.com/oauth2/default
          clientId: abc
          clientSecret: "${BOW_OIDC_OKTA_CLIENT_SECRET}"
    asserts:
      - notMatchRegex:
          path: data.bowConfig
          pattern: "org_mapping|trust_email_for_linking"

  - it: refuses a mapping rule without an organization
    set:
      config.oidcProviders:
        - name: entra
          issuer: https://login.example.com/tenant/v2.0
          clientId: abc
          clientSecret: "${BOW_OIDC_ENTRA_CLIENT_SECRET}"
          orgMapping:
            - group: some-group
    asserts:
      - failedTemplate:
          errorMessage: "config.oidcProviders[].orgMapping[].organization is required"
