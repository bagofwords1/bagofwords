# Deployment Configuration
base_url: http://0.0.0.0:3000


# Feature Flags
features:
  allow_uninvited_signups: false
  allow_multiple_organizations: false 
  verify_emails: false


auth:
  mode: "hybrid" # hybrid | local_only | sso_only

google_oauth:
  enabled: false

