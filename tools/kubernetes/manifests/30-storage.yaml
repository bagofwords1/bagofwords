# Storage chain: a claim on a class whose provisioner does not exist stays
# Pending (claim → class → csi_drivers explains why); a StatefulSet on kind's
# default class gets a real bound PV.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: slow-nfs
provisioner: nfs.example.com/provisioner      # not installed on this cluster
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ledger-archive
  namespace: payments
spec:
  storageClassName: slow-nfs
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 50Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: archiver
  namespace: payments
  labels: {app: archiver}
spec:
  containers:
    - name: archiver
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{name: archive, mountPath: /archive}]
  volumes:
    - name: archive
      persistentVolumeClaim: {claimName: ledger-archive}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: inventory
spec:
  clusterIP: None
  selector: {app: catalog-db}
  ports: [{port: 5432, name: pg}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-db
  namespace: inventory
spec:
  serviceName: catalog-db
  replicas: 1
  selector:
    matchLabels: {app: catalog-db}
  template:
    metadata:
      labels: {app: catalog-db, app.kubernetes.io/name: catalog-db}
    spec:
      containers:
        - name: db
          image: busybox:1.36
          command: ["sh", "-c", "echo 'db ready'; sleep 3600"]
          # inventory has a ResourceQuota on requests → every pod must declare them
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
