# The failure states an RCA session should find.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scorer
  namespace: payments
  labels: {app.kubernetes.io/name: fraud-scorer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: fraud-scorer}
  template:
    metadata:
      labels: {app: fraud-scorer, app.kubernetes.io/name: fraud-scorer}
    spec:
      containers:
        - name: scorer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'loading model'; echo 'ERROR: model file /models/v3.bin not found'; exit 1"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-builder
  namespace: payments
  labels: {app.kubernetes.io/name: report-builder}
spec:
  replicas: 1
  selector:
    matchLabels: {app: report-builder}
  template:
    metadata:
      labels: {app: report-builder, app.kubernetes.io/name: report-builder}
    spec:
      containers:
        - name: builder
          image: busybox:1.36
          # tail buffers everything it reads → exceeds the 32Mi limit → OOMKilled
          command: ["sh", "-c", "echo 'building monthly report'; head -c 300000000 /dev/zero | tail; sleep 3600"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 32Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-batch
  namespace: payments
  labels: {app: gpu-batch}
spec:
  nodeSelector: {accelerator: nvidia-h100}   # no such node → Pending/Unschedulable
  containers:
    - name: batch
      image: busybox:1.36
      command: ["sleep", "3600"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-reconcile
  namespace: payments
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reconcile
              image: busybox:1.36
              command: ["sh", "-c", "echo 'reconciling ledger'; echo 'FATAL: ledger db unreachable'; exit 2"]
