apiVersion: v1
kind: ServiceAccount
metadata:
  name: openshell-sandbox
  namespace: openshell
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshell-sandbox-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: openshell
