apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-server
  namespace: openshell
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mcp-server-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: mcp-server
    namespace: openshell
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: openshell
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      serviceAccountName: mcp-server
      containers:
        - name: mcp-server
          image: localhost:32000/bagofwords:dev
          imagePullPolicy: Always
          env:
          - name: GIT_BRANCH
            value: feature/secure-data-tunnel
          - name: GIT_REPO
            value: https://github.com/Dimss/bagofwords.git
          command: ["/bin/bash", "-c"," . clone.sh && uv run --script tools/agent/mcp-k8s-server.py --sse --host 0.0.0.0 --port 8080"]
          ports:
            - containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
  namespace: openshell
  labels:
    app: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
