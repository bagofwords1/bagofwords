# Local Elasticsearch 8.x for the elasticsearch connector feedback loop.
# Security ON (so the API-key / basic auth paths are exercised) but HTTP TLS
# OFF, so the demo connects over http with no self-signed-cert friction.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: bow-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ELASTIC_PASSWORD=elastic_pwd
      - ingest.geoip.downloader.enabled=false
      # Sandboxes often sit above the 90% disk watermark, which blocks shard
      # allocation and pins the cluster RED. Disable the decider for the demo.
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:elastic_pwd http://localhost:9200/_cluster/health | grep -q status"]
      interval: 5s
      timeout: 5s
      retries: 40

  # Kibana for the dashboard-catalog feedback loop. It authenticates to ES as
  # kibana_system, whose password is set by seed_kibana.py — Kibana retries
  # until that runs, so start order doesn't matter. Web UI + API on :5601.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: bow-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=kibana_pwd
      - xpack.encryptedSavedObjects.encryptionKey=bow-sandbox-encryption-key-32ch
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 60
