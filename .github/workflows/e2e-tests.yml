name: e2e tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger

# A new push to the same PR supersedes the run in flight — there is no point
# finishing a two-hour suite against a commit nobody will merge. Pushes to
# main are never cancelled: dispatch-build hangs off that run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a PR can skip the backend e2e suite. It is an allowlist: a
  # file skips only if it is listed here as unable to affect the backend, and
  # anything new or unlisted runs everything. Skipping needs every changed file
  # to be listed. Do not add a path because it looks harmless: check that neither
  # backend/app nor backend/tests read it (frontend/public is left out because
  # both do, and CHANGELOG.md, VERSION and bow-config.yaml are read at runtime).
  #
  # This job must run on every event, never be skipped. dispatch-build inherits
  # needs from e2e-tests, and a skipped job anywhere up that chain would skip
  # dispatch-build too. On anything but a PR its one step is skipped, so the
  # output is false and everything runs.
  #
  # When in doubt it runs the suite: a failed filter step leaves the output
  # false, and an empty PR or one over the 3,000 files the API can list never
  # reaches the filter.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip_backend_e2e: ${{ steps.filter.outputs.backend_e2e == 'false' && steps.filter.outputs.must_run == 'false' }}
    steps:
    - name: Classify changed files
      id: filter
      if: github.event_name == 'pull_request' && github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000
      continue-on-error: true
      uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
      with:
        predicate-quantifier: every
        filters: |
          backend_e2e:
            - '**'
            - '!docs/**'
            - '!media/**'
            - '!locales/**'
            - '!README.md'
            - '!LICENSE'
            - '!SECURITY.md'
            - '!DEV.md'
            - '!frontend/README.md'
            - '!frontend/assets/**'
            - '!frontend/components/**'
            - '!frontend/composables/**'
            - '!frontend/ee/**'
            - '!frontend/layouts/**'
            - '!frontend/media/**'
            - '!frontend/middleware/**'
            - '!frontend/pages/**'
            - '!frontend/plugins/**'
            - '!frontend/tests/**'
            - '!frontend/utils/**'
          must_run:
            - '**/{Dockerfile*,*.lock,*-lock.*}'

  # `if` is evaluated before the matrix expands, so when this job is skipped
  # GitHub reports one check named `e2e-tests`. `e2e-tests (sqlite)` and
  # `e2e-tests (postgres)` then never appear, and a PR that required either one
  # would wait forever. Require `e2e-tests-result` instead.
  e2e-tests:
    needs: changes
    # !cancelled(): if `changes` itself fails, run the suite rather than skip it.
    if: ${{ !cancelled() && needs.changes.outputs.skip_backend_e2e != 'true' }}
    runs-on: ubuntu-latest
    # The suite outgrew the old 60- then 90-minute caps. 120 is no longer
    # generous: the Postgres job reaches it in about 41% of runs, 93-96% done.
    # Raising it again only postpones that; the cost is test setup, not this cap.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-backend

    - name: Check for AI file changes
      id: changes
      uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
      with:
        filters: |
          ai_files:
            - 'backend/app/ai/**'

    - name: Run AI tests
      if: steps.changes.outputs.ai_files == 'true'
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
        OPENAI_API_KEY_TEST: ${{ secrets.OPENAI_API_KEY_TEST }}
      run: |
        uv run pytest -s -m ai --db=${{ matrix.db }} --disable-warnings --timeout=600 --timeout-method=thread

    - name: Run E2E tests
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
        OPENAI_API_KEY_TEST: ${{ secrets.OPENAI_API_KEY_TEST }}
      # pytest-xdist parallelizes the suite. Each worker is a separate process
      # with its own DB (its own database on the one shared Postgres container /
      # its own PID+UUID SQLite file per tests/conftest.py), so workers never
      # share a database and the per-test schema reset stays isolation-safe.
      #
      # -n 4: this used to be capped at 2 because at 4 workers the runner
      # SIGKILLed a worker at a memory peak ("worker 'gwN' crashed", no
      # traceback). Back then the controller and every worker each started
      # their own Postgres container (five at -n 4); the suite now boots one
      # container per run and the per-test teardown no longer burns 5s in a
      # loop-shutdown deadlock (see connection_indexing_service), so the peak
      # is both lower and shorter. If a worker crashes again, drop back to 2.
      #
      # No -s: unbuffered per-test stdout from four workers interleaves into
      # noise and hides the progress line; failures still print captured output.
      #
      # --durations=50: list the slowest tests in every run, so the next
      # regression in per-test cost shows up in the log instead of the timeout.
      #
      # --junitxml + ci_phase_times: full per-test timings, setup time included,
      # uploaded below. pytest only writes the file when the session ends, and a
      # job killed at timeout-minutes never gets there.
      #
      # --session-timeout=6900 is why it normally does get there. At 115 minutes
      # pytest stops once a running test finishes, then prints the full failure
      # summary and writes the XML. The step still fails (exit 2), so a stopped
      # run cannot read as a pass. timeout-minutes stays as the hard backstop.
      # Today this step starts 3 to 5 minutes into the job, and the cache gives
      # back about 2.5 of them, so the stop costs a run 2 minutes at most.
      #
      # -v: name each test as it starts and finishes. Without it a failure is a
      # bare F until the end-of-run summary, so a killed run cannot say which
      # test failed. Costs about 1 MB on a 12 MB log.
      #
      # tests/e2e: every e2e-marked test lives there. Without the path the
      # controller and each worker imported all ~11.5k tests (unit, ai, evals …)
      # only to deselect them — ~110s of collection per process instead of ~15s.
      #
      # test_fast_artifact_lifecycle.py rides along (-m "e2e or db" picks up its
      # db-marked tests): it exercises the custom-table artifact lock, swap and
      # sweep against the real database and must run on both backends, which
      # the sqlite-only unit job cannot give it. In the same invocation it
      # shares this job's one Postgres server instead of booting a second
      # container, and a failure in it is a failure of this run, not a gate
      # that skips the whole E2E suite.
      run: |
        uv run pytest tests/e2e tests/unit/test_fast_artifact_lifecycle.py -n 4 -v -m "e2e or db" --db=${{ matrix.db }} --durations=50 --disable-warnings --timeout=600 --timeout-method=thread --session-timeout=6900 --junitxml=test-results/junit-${{ matrix.db }}.xml -p tests.ci_phase_times

    # always(), not !cancelled(): a run stopped by the job timeout counts as
    # cancelled, and that is the run whose data is most wanted.
    - name: Upload JUnit timings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: junit-${{ matrix.db }}
        path: backend/test-results/
        if-no-files-found: warn
        retention-days: 30

    # Report-only for now. backend/scripts/ci_time_budget.py says how to make it
    # blocking.
    - name: Report slow tests
      if: always()
      continue-on-error: true
      run: python3 backend/scripts/ci_time_budget.py backend/test-results/junit-${{ matrix.db }}.xml

  # The one e2e test a frontend change can break: it reads frontend/**/*.{vue,ts}
  # and checks each useCan('x') against the permission registry. It runs on its
  # own when the suite is skipped, so skipping loses nothing a frontend PR could
  # have failed. Any new e2e test that reads frontend/ belongs here too.
  e2e-skipped-checks:
    needs: changes
    if: needs.changes.outputs.skip_backend_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-backend

    - name: Check frontend permissions against the registry
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
      run: |
        uv run pytest "tests/e2e/rbac/test_rbac_registry.py::test_frontend_use_can_permissions_exist_in_registry" -m e2e --db=sqlite --disable-warnings --timeout=600 --timeout-method=thread

  # One check with the same name on every run, so this is the one to require.
  # always(), not !cancelled(): a job skipped by a condition reports success, so
  # a result job that skipped on a cancelled run would let an untested PR merge.
  e2e-tests-result:
    if: always()
    needs: [changes, e2e-tests, e2e-skipped-checks]
    runs-on: ubuntu-latest
    steps:
    - name: Check the e2e outcome
      env:
        SKIP: ${{ needs.changes.outputs.skip_backend_e2e }}
        E2E: ${{ needs.e2e-tests.result }}
        SKIPPED_CHECKS: ${{ needs.e2e-skipped-checks.result }}
      run: |
        echo "skip=$SKIP e2e=$E2E skipped-checks=$SKIPPED_CHECKS"
        if [ "$SKIP" = "true" ]; then
          [ "$E2E" = "skipped" ] && [ "$SKIPPED_CHECKS" = "success" ]
        else
          [ "$E2E" = "success" ]
        fi

  # tests/unit carries no pytest marker, so the -m e2e / -m ai steps above never
  # touched it and nothing else ran it either — two MS Fabric OAuth assertions
  # sat red for two months before anyone noticed. It is pure logic (no HTTP, no
  # containers), so it runs once on sqlite rather than across the db matrix.
  #
  # Non-blocking (continue-on-error). This began when the serial suite hit the
  # job timeout on every push; that is long gone. It stays for now because the
  # job has too short a green record: main has passed only since 5 Nov, and a
  # timing test still fails now and then (test_connection_indexing_liveness.py).
  # Real failures stay visible in the checks list. dispatch-build has never
  # depended on this job.
  unit-tests:
    runs-on: ubuntu-latest
    # The suite takes about 7 minutes at -n 4 on a hosted runner. The limit is
    # far above that and only bounds a hang.
    timeout-minutes: 120
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-backend

    - name: Run unit tests
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
      # pytest-xdist, same cure the E2E step got when it outgrew its timeout.
      # Unit tests are pure logic; the per-test fresh database is opt-in here
      # (@pytest.mark.db, see tests/unit/conftest.py) so the ~90% of tests that
      # never open a session no longer pay ~1s of engine-dispose + file-swap
      # overhead each — that overhead was most of the hour this job once took.
      run: |
        uv run pytest tests/unit -n 4 --db=sqlite --disable-warnings --timeout=600 --timeout-method=thread

  playwright-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-backend

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'yarn'
        cache-dependency-path: frontend/yarn.lock

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: yarn install --frozen-lockfile

    - name: Install Playwright browsers
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Embed SDK tests
      working-directory: ./frontend
      run: node --test tests/unit/embedSdk.mjs tests/unit/embedSdkBrowser.mjs

    - name: Start backend server
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
        TEST_DATABASE_URL: "sqlite:///db/playwright.db"
      run: |
        mkdir -p db uploads/files uploads/branding
        echo "Running database migrations..."
        uv run alembic upgrade head
        echo "Migrations complete, starting server..."
        uv run python main.py &
        echo "Waiting for backend to start..."
        timeout 60 bash -c 'until curl -s http://localhost:8000/health > /dev/null 2>&1; do sleep 1; done'
        echo "Backend is ready"

    - name: Build frontend (production)
      working-directory: ./frontend
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: |
        echo "Building frontend for production..."
        yarn build
        echo "Build complete"

    - name: Start frontend (production server)
      working-directory: ./frontend
      run: |
        # Production build instead of `yarn dev`: routes are pre-compiled, so the
        # SPA hydrates fast and reliably under parallel workers (dev mode's
        # on-demand Vite compilation was thrashing the server and timing out
        # page loads). @nuxt-alt/proxy runs in this output server too
        # (experimental.listener), so /api still proxies to the backend.
        node .output/server/index.mjs &
        echo "Waiting for frontend to start..."
        timeout 60 bash -c 'until curl -s http://localhost:3000 > /dev/null 2>&1; do sleep 1; done'
        echo "Frontend is ready"

    - name: Warm up application
      run: |
        echo "Warming up frontend and backend..."
        curl -s http://localhost:3000/users/sign-up > /dev/null || true
        # Sanity-check the /api proxy works through the production server.
        curl -s http://localhost:3000/api/settings > /dev/null || true
        curl -s http://localhost:8000/api/settings > /dev/null || true
        sleep 3
        echo "Warmup complete"

    - name: Run Playwright tests
      working-directory: ./frontend
      env:
        OPENAI_API_KEY_TEST: ${{ secrets.OPENAI_API_KEY_TEST }}
      run: npx playwright test --workers=2

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          frontend/test-results/
          frontend/tests/config/*.png
        retention-days: 7

  # Integration tests - run on main push OR on PRs from the same repo (not forks for security)
  integration-data-sources:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/setup-backend

    - name: Restore integrations credentials
      run: |
        echo "$INTEGRATIONS_JSON_B64" | base64 -d > backend/tests/integrations/integrations.json
      env:
        INTEGRATIONS_JSON_B64: ${{ secrets.INTEGRATIONS_JSON_B64 }}

    - name: Run data source integration tests
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
      run: |
        uv run pytest -v tests/integrations/ds_clients.py --disable-warnings

  integration-llms:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Check for LLM-related file changes
      id: changes
      uses: dorny/paths-filter@v3
      with:
        filters: |
          llm_files:
            - 'backend/app/ai/**'
            - 'backend/app/models/llm*'

    - uses: ./.github/actions/setup-backend
      if: steps.changes.outputs.llm_files == 'true'

    - name: Restore integrations credentials
      if: steps.changes.outputs.llm_files == 'true'
      run: |
        echo "$INTEGRATIONS_JSON_B64" | base64 -d > backend/tests/integrations/integrations.json
      env:
        INTEGRATIONS_JSON_B64: ${{ secrets.INTEGRATIONS_JSON_B64 }}

    - name: Run LLM integration tests
      if: steps.changes.outputs.llm_files == 'true'
      working-directory: ./backend
      env:
        TESTING: "true"
        ENVIRONMENT: "production"
      run: |
        # Temporarily skip providers/cases that fail in CI:
        #  - google: API key flagged as leaked (403)
        #  - bedrock: no AWS credentials available in CI
        #  - openai reasoning: model does not emit reasoning deltas
        uv run pytest -v tests/integrations/llm_clients.py --disable-warnings \
          -k "not google and not bedrock and not (reasoning and openai)"

  dispatch-build:
    if: github.ref == 'refs/heads/main'
    needs: [e2e-tests, playwright-tests, integration-data-sources, integration-llms]
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Docker build workflow
      uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
      with:
        token: ${{ secrets.PAT_TOKEN }}
        event-type: e2e-tests-passed
