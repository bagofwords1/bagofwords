name: Build and Push Docker Image

on:
  workflow_dispatch:
  repository_dispatch:
    types: [e2e-tests-passed]

permissions:
  contents: read
  security-events: write

env:
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'bagofwords/bagofwords' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get VERSION and DATE
        id: version
        run: |
          VERSION=$(cat VERSION)
          DATE=$(date +'%Y%m%d')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION}-${DATE}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    # Native runner per arch: arm64 under QEMU on x86 was the bottleneck.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          docker system prune -af --volumes || true
          docker buildx prune -af || true

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:cache-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:cache-${{ env.PLATFORM_PAIR }},mode=max
          outputs: type=image,name=${{ env.DOCKER_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  scan:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform_pair: [linux-amd64, linux-arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download platform digest
        uses: actions/download-artifact@v4
        with:
          name: digests-${{ matrix.platform_pair }}
          path: /tmp/digests

      - name: Resolve platform digest
        id: digest
        run: |
          DIGEST=$(ls /tmp/digests | head -1)
          echo "ref=${{ env.DOCKER_IMAGE }}@sha256:${DIGEST}" >> $GITHUB_OUTPUT

      - name: Trivy scan summary (stdout)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.digest.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

      - name: Scan image with Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.digest.outputs.ref }}
          format: sarif
          exit-code: 0
          severity: CRITICAL,HIGH
          output: trivy-results.sarif

      # Gate every release tag on both architectures; reviewed exceptions go in .trivyignore
      - name: Trivy gate (HIGH/CRITICAL)
        id: gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.digest.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          trivyignores: ${{ hashFiles('.trivyignore') != '' && '.trivyignore' || '' }}
          exit-code: 1

      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: release-${{ matrix.platform_pair }}

  merge:
    needs: [prepare, build, scan]
    # Implicit success() requires all scan matrix legs to pass.
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.version }} \
            -t ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.version_tag }} \
            -t ${{ env.DOCKER_IMAGE }}:latest \
            $(printf '${{ env.DOCKER_IMAGE }}@sha256:%s ' *)

  airgap:
    needs: [prepare, merge]
    if: vars.AIRGAP_BUCKET != ''
    uses: ./.github/workflows/airgap-bundle.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      image_tag: ${{ needs.prepare.outputs.version_tag }}
    secrets: inherit

  release:
    needs: merge
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
