<!doctype html>
<!-- A legitimate MCP host: renders the ui:// resource HTML it got from
     resources/read in a sandboxed srcdoc frame (its own opaque origin, never the
     app origin) and serves the artifact over the MCP Apps postMessage protocol.
     The runner injects the resource text with window.mount(html). -->
<html><body style="font-family:sans-serif">
<h3>MCP host (<span id="me"></span>) rendering ui://bagofwords/artifact</h3>
<iframe id="app" sandbox="allow-scripts" width="640" height="220" style="border:1px solid #070"></iframe>
<script>
document.getElementById('me').textContent = location.origin;
var app = document.getElementById('app');
var CODE = "function App(){ return <div id='ok' className='p-4 text-green-700 font-bold'>legit artifact rendered via MCP host</div>; }\n" +
  "ReactDOM.createRoot(document.getElementById('root')).render(<App/>);";
function reply(id, result) { app.contentWindow.postMessage({ jsonrpc: '2.0', id: id, result: result }, '*'); }
window.addEventListener('message', function (e) {
  if (e.source !== app.contentWindow) return;
  var m = e.data;
  if (!m || m.jsonrpc !== '2.0' || m.id == null) return;
  if (m.method === 'ui/initialize') {
    reply(m.id, {});
    setTimeout(function () {
      app.contentWindow.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/tool-result',
        params: { content: [{ type: 'text', text: JSON.stringify({ artifact_id: 'a1' }) }] } }, '*');
    }, 50);
  } else if (m.method === 'tools/call') {
    reply(m.id, { content: [{ type: 'text', text: JSON.stringify({ code: CODE, mode: 'page', report: {}, visualizations: [] }) }] });
  }
});
window.mount = function (html) { app.srcdoc = html; };
</script>
</body></html>
