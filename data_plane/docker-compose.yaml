# Bow Data Edge Agent — customer-site deployment example.
#
# The agent runs inside the customer's own network and connects OUT to Bow's
# NATS endpoint; there is no inbound exposure. Copy this file, fill the values
# (ideally via a .env file next to it), and `docker compose up -d`.
#
#   docker compose build      # first time, or after an agent upgrade
#   docker compose up -d
#   docker compose logs -f
#
# The admin UI is published to the host's loopback only (127.0.0.1:9191). Reach
# it over an SSH tunnel or from the host itself — never bind it to a public
# interface; it is the credential-entry surface and has no auth by design.

services:
  edge-agent:
    build:
      context: ..                       # repo root — the image carries backend/app too
      dockerfile: data_plane/Dockerfile
    image: bow/data-edge-agent:latest
    restart: unless-stopped
    environment:
      # --- identity (must match the org + agent provisioned on Bow's broker) --
      BOW_EDGE_AGENT_ORG_ID:        ${BOW_ORG_ID:?set BOW_ORG_ID}
      BOW_EDGE_AGENT_EDGE_AGENT_ID: ${BOW_EDGE_AGENT_ID:?set BOW_EDGE_AGENT_ID}
      BOW_EDGE_AGENT_EDGE_AGENT_NAME: ${BOW_EDGE_AGENT_NAME:-}
      # --- broker ------------------------------------------------------------
      # Must be TLS-bearing (wss:// or tls://) — mTLS is the only auth and the
      # client cert is exchanged in the TLS handshake.
      BOW_EDGE_AGENT_TUNNEL_ENDPOINT_URL: ${BOW_TUNNEL_ENDPOINT_URL:?set BOW_TUNNEL_ENDPOINT_URL}
      # --- mTLS auth (design A11) — the only authentication ------------------
      # Paths INSIDE the container; mount the PEMs read-only via the volume
      # below. tls_cert + tls_key are required; tls_ca is the CA that signed the
      # broker's server cert (omit to trust the system roots).
      BOW_EDGE_AGENT_TLS_CA:   /tls/ca.pem
      BOW_EDGE_AGENT_TLS_CERT: /tls/edge-agent.pem
      BOW_EDGE_AGENT_TLS_KEY:  /tls/edge-agent-key.pem
      # Admin UI binds all interfaces INSIDE the container; the port mapping
      # below is what keeps it on the host's loopback.
      BOW_EDGE_AGENT_ADMIN_HOST:    0.0.0.0
    ports:
      - "127.0.0.1:9191:9191"           # admin UI — host loopback only
    volumes:
      - edge-data:/data                 # persists the store and the audit trail
      # The mTLS client cert + key + CA. Point at the host dir holding them.
      - ${BOW_TLS_DIR:?set BOW_TLS_DIR to the host dir with ca.pem/edge-agent.pem/edge-agent-key.pem}:/tls:ro
    # Drop privileges further: the agent needs no capabilities and never writes
    # outside /data (a named volume) and its own read-only source.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  edge-data:
