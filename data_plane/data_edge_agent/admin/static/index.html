<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bow Data Edge Agent</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #5b8cff; --accent2: #3a63c4;
    --ok: #35c46a; --warn: #e0a13a; --err: #e5484d; --chip: #232836;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header .brand { font-weight: 650; font-size: 15px; letter-spacing: .2px; }
  header .brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  .spacer { flex: 1; }
  .stat { color: var(--muted); font-size: 12.5px; }
  .stat b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(53,196,106,.15); }
  .dot.err { background: var(--err); box-shadow: 0 0 0 3px rgba(229,72,77,.15); }
  main { max-width: 940px; margin: 26px auto; padding: 0 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h2 { font-size: 16px; margin: 0; }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--text); padding: 7px 13px;
  }
  button:hover { border-color: #3a4150; }
  button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  button.primary:hover { background: var(--accent); border-color: var(--accent); }
  button.danger { color: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
    padding: 14px 16px; display: flex; align-items: center; gap: 14px;
  }
  .card .id { flex: 1; min-width: 0; }
  .card .id .nm { font-weight: 600; }
  .card .id .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .chip {
    display: inline-block; background: var(--chip); border: 1px solid var(--border);
    border-radius: 999px; padding: 1px 9px; font-size: 11.5px; color: var(--muted);
  }
  .chip.type { color: #a9c1ff; }
  .card .acts { display: flex; gap: 7px; }
  .empty, .loading { color: var(--muted); text-align: center; padding: 40px 0; }
  .result { font-size: 12.5px; margin-top: 4px; }
  .result.ok { color: var(--ok); } .result.err { color: var(--err); }
  /* tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab { padding: 8px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  /* audit table */
  .audit-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); }
  table.audit { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.audit th { text-align: left; color: var(--muted); font-weight: 500; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.audit td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.audit tr:last-child td { border-bottom: none; }
  table.audit td.sql { max-width: 340px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11px; }
  .badge.ok { background: rgba(53,196,106,.14); color: var(--ok); }
  .badge.error { background: rgba(229,72,77,.14); color: var(--err); }
  .badge.timeout { background: rgba(224,161,58,.14); color: var(--warn); }
  .badge.not_implemented { background: var(--chip); color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  /* form */
  .backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 20;
    overflow-y: auto;  /* safety net: a modal taller than the viewport still scrolls */
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    width: 560px; max-width: 100%; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  /* form modal: cap height, scroll the fields, keep the buttons pinned + visible */
  .modal-form {
    display: flex; flex-direction: column; max-height: calc(100vh - 80px);
  }
  .modal-form .modal-body {
    overflow-y: auto; flex: 1 1 auto;
    /* bleed the scroll area to the modal edges, then restore the inset so focus
       rings aren't clipped */
    margin: 0 -24px; padding: 0 24px;
  }
  .modal-form .foot { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .modal-form .banner { margin-top: 14px; }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  input:disabled { opacity: .6; }
  textarea { resize: vertical; min-height: 62px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0 14px; }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .foot { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
  .foot .spacer { flex: 1; }
  .banner { padding: 8px 11px; border-radius: 8px; font-size: 12.5px; margin-top: 12px; display: none; }
  .banner.ok { display: block; background: rgba(53,196,106,.12); color: var(--ok); }
  .banner.err { display: block; background: rgba(229,72,77,.12); color: var(--err); }
  /* dynamic form fields */
  .fld { margin-bottom: 2px; }
  .fld > label { margin-top: 12px; }
  .fld .fhint { color: var(--muted); font-size: 11.5px; margin: 4px 0 2px; }
  .fld label.chk { display: flex; align-items: center; gap: 8px; color: var(--text); margin-top: 14px; cursor: pointer; }
  .fld label.chk input { width: auto; }
  .opt { opacity: .6; }
  .sec { margin: 20px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  details.oauth { margin-top: 12px; }
  /* type picker */
  .modal.modal-lg { width: 760px; }
  .modal-lg .row h3 { margin: 0; }
  .modal-lg #p_close { padding: 4px 10px; }
  .pick-scroll { max-height: 60vh; overflow-y: auto; margin-top: 14px; }
  .pick-cat { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 16px 0 8px; }
  .pick-cat:first-child { margin-top: 4px; }
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .pick-tile {
    display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center;
    padding: 16px 10px; border-radius: 11px; background: var(--panel2); border: 1px solid var(--border);
  }
  .pick-tile:hover { border-color: var(--accent); }
  .pick-title { font-size: 12.5px; color: var(--text); line-height: 1.3; }
  /* type icons (img) + monogram fallback (span.mono), shared by tiles + cards */
  .pick-ico { width: 40px; height: 40px; border-radius: 9px; object-fit: contain; background: #fff; padding: 6px; }
  .pick-ico.mono { display: flex; align-items: center; justify-content: center; background: var(--chip); color: #a9c1ff; font-weight: 650; font-size: 14px; letter-spacing: .5px; padding: 0; }
  .card-ico { width: 30px; height: 30px; border-radius: 7px; object-fit: contain; background: #fff; padding: 4px; flex-shrink: 0; }
  .card-ico.mono { display: flex; align-items: center; justify-content: center; background: var(--chip); color: #a9c1ff; font-weight: 650; font-size: 11.5px; padding: 0; }
</style>
</head>
<body>
<header>
  <div class="brand">Bow Data Edge Agent<small id="agentId">—</small></div>
  <div class="spacer"></div>
  <div class="stat"><span id="natsDot" class="dot err"></span>NATS <b id="natsState">…</b></div>
  <div class="stat">Serving <b id="servedCount">0</b></div>
  <div class="stat">In-flight <b id="inflight">0</b></div>
  <div class="stat">v<b id="version">—</b></div>
</header>

<main>
  <div class="tabs">
    <div class="tab active" id="tabConnections" data-panel="connections">Connections</div>
    <div class="tab" id="tabAudit" data-panel="audit">Audit log</div>
  </div>

  <section id="panelConnections">
    <div class="row">
      <h2>Connections</h2>
      <button class="primary" id="addBtn">+ Add connection</button>
    </div>
    <div id="list" class="cards"><div class="loading">Loading…</div></div>
  </section>

  <section id="panelAudit" hidden>
    <div class="row">
      <h2>Audit log</h2>
      <button id="auditRefresh">Refresh</button>
    </div>
    <div class="audit-wrap">
      <table class="audit">
        <thead><tr>
          <th>Time</th><th>Connection</th><th>Operation</th>
          <th class="num">Rows</th><th class="num">Duration</th><th>Outcome</th><th>SQL / error</th>
        </tr></thead>
        <tbody id="auditRows"><tr><td colspan="7" class="loading">Loading…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<div id="modalHost"></div>

<script>
const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch("/api" + path, opt);
  let data = null;
  try { data = await r.json(); } catch (e) { /* empty */ }
  if (!r.ok) throw new Error((data && (data.error || data.reason)) || r.statusText || ("HTTP " + r.status));
  return data;
}

// ---- status header --------------------------------------------------------
async function refreshStatus() {
  try {
    const s = await api("GET", "/status");
    $("agentId").textContent = (s.edge_agent_name ? s.edge_agent_name + " · " : "") + s.edge_agent_id;
    $("version").textContent = s.version || "—";
    $("servedCount").textContent = s.connections_served;
    $("inflight").textContent = s.in_flight;
    const up = s.nats && s.nats.connected;
    $("natsDot").className = "dot " + (up ? "ok" : "err");
    $("natsState").textContent = up ? "connected" : "disconnected";
    $("natsState").title = s.nats ? s.nats.url : "";
  } catch (e) {
    $("natsDot").className = "dot err"; $("natsState").textContent = "unreachable";
  }
}

// ---- connection list ------------------------------------------------------
async function refreshList() {
  const host = $("list");
  try {
    const { connections } = await api("GET", "/connections");
    if (!connections.length) { host.innerHTML = '<div class="empty">No connections yet. Add one to start serving it over the tunnel.</div>'; return; }
    host.innerHTML = "";
    for (const c of connections) host.appendChild(cardFor(c));
  } catch (e) {
    host.innerHTML = '<div class="empty">Failed to load: ' + escapeHtml(e.message) + '</div>';
  }
}

function cardFor(c) {
  const el = document.createElement("div");
  el.className = "card";
  const host = c.config && c.config.host ? c.config.host : "";
  const db = c.config && c.config.database ? c.config.database : "";
  const sub = [host, db].filter(Boolean).join(" / ");
  const credNote = c.credential_keys.length ? c.credential_keys.join(", ") + " set" : "no credentials";
  el.innerHTML =
    iconHtml(c.type, c.label || c.name, "card-ico") +
    '<div class="id"><div class="nm">' + escapeHtml(c.label || c.name) +
      ' <span class="chip type">' + escapeHtml(c.type) + '</span></div>' +
      '<div class="sub">' + escapeHtml(c.name) + (sub ? ' · ' + escapeHtml(sub) : '') +
      ' · <span class="chip">' + escapeHtml(credNote) + '</span></div>' +
      '<div class="result" data-result></div></div>' +
    '<div class="acts">' +
      '<button data-test>Test</button>' +
      '<button data-edit>Edit</button>' +
      '<button class="danger" data-del>Delete</button>' +
    '</div>';
  wireIcons(el);
  el.querySelector("[data-test]").onclick = (ev) => testSaved(c.name, el.querySelector("[data-result]"), ev.target);
  el.querySelector("[data-edit]").onclick = () => openForm(c.type, c);
  el.querySelector("[data-del]").onclick = () => delConn(c);
  return el;
}

async function testSaved(name, out, btn) {
  out.textContent = "Testing…"; out.className = "result";
  btn.disabled = true;
  try {
    const r = await api("POST", "/connections/" + encodeURIComponent(name) + "/test");
    out.className = "result " + (r.success ? "ok" : "err");
    out.textContent = (r.success ? "✓ " : "✗ ") + (r.message || (r.success ? "ok" : "failed"));
  } catch (e) { out.className = "result err"; out.textContent = "✗ " + e.message; }
  finally { btn.disabled = false; }
}

async function delConn(c) {
  if (!confirm("Delete connection “" + (c.label || c.name) + "”?\nBow will stop seeing it over the tunnel.")) return;
  try { await api("DELETE", "/connections/" + encodeURIComponent(c.name)); await refreshAll(); }
  catch (e) { alert("Delete failed: " + e.message); }
}

// ---- add / edit form ------------------------------------------------------
// ---- Add Connection: type picker → type-specific dynamic form -------------
let CATALOG = null;          // [{type,title,category}]
let CUR_TYPE = null;         // type being added/edited
let CUR_SPEC = null;         // its full field spec
let CUR_REQUIRED = { config: [], credentials: [] };
const CAT_LABELS = { databases: "Databases & warehouses", bi: "BI & analytics", infra: "Infrastructure", services: "Services", files: "Files & object store" };
const CAT_ORDER = ["databases", "bi", "infra", "services", "files"];

let ICONS = {};   // { type: icon_filename }, from /api/icons

function monogram(title) {
  const words = String(title).replace(/[^A-Za-z0-9 ]/g, "").trim().split(/\s+/);
  if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  return String(title).replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "?";
}

// The brand icon for a type as an <img>, or a monogram span when there's no
// bundled asset. The img carries data-mono so wireIcons() can swap it for a
// monogram if it ever fails to load — nothing renders broken.
function iconHtml(type, title, cls) {
  const file = ICONS[type];
  const mono = monogram(title);
  if (file) return '<img class="' + cls + '" data-mono="' + escapeAttr(mono) + '" alt="" src="/data_sources_icons/' + encodeURIComponent(file) + '">';
  return '<span class="' + cls + ' mono">' + escapeHtml(mono) + '</span>';
}

function wireIcons(root) {
  for (const img of (root || document).querySelectorAll("img[data-mono]")) {
    img.onerror = () => {
      const s = document.createElement("span");
      s.className = img.className + " mono";
      s.textContent = img.dataset.mono || "?";
      img.replaceWith(s);
    };
  }
}

async function openPicker() {
  if (!CATALOG) { try { CATALOG = (await api("GET", "/catalog")).catalog; } catch (e) { CATALOG = []; } }
  renderPicker("");
}

function renderPicker(q) {
  const ql = q.trim().toLowerCase();
  const tiles = CATALOG.filter(t => !ql || t.title.toLowerCase().includes(ql) || t.type.toLowerCase().includes(ql));
  let body = "";
  for (const cat of CAT_ORDER) {
    const group = tiles.filter(t => t.category === cat);
    if (!group.length) continue;
    body += '<div class="pick-cat">' + escapeHtml(CAT_LABELS[cat] || cat) + '</div><div class="pick-grid">';
    for (const t of group) {
      body += '<button class="pick-tile" data-type="' + escapeAttr(t.type) + '">' +
        iconHtml(t.type, t.title, "pick-ico") +
        '<span class="pick-title">' + escapeHtml(t.title) + '</span></button>';
    }
    body += '</div>';
  }
  if (!body) body = '<div class="empty">No data sources match “' + escapeHtml(q) + '”.</div>';
  $("modalHost").innerHTML =
    '<div class="backdrop"><div class="modal modal-lg">' +
    '<div class="row"><h3>Add connection</h3><button id="p_close">✕</button></div>' +
    '<div class="hint">Select a data source type. Credentials are stored encrypted on this agent and never sent to Bow.</div>' +
    '<input id="p_search" placeholder="Search data sources…" value="' + escapeAttr(q) + '">' +
    '<div class="pick-scroll">' + body + '</div>' +
    '</div></div>';
  wireIcons($("modalHost"));
  $("p_close").onclick = closeForm;
  const s = $("p_search"); s.oninput = () => renderPicker(s.value); s.focus();
  for (const b of document.querySelectorAll(".pick-tile")) b.onclick = () => openForm(b.dataset.type, null);
}

// Minimal fallback spec for a type with no bundled schema (e.g. editing an
// older connection whose type predates the catalog): the classic SQL fields.
function genericSpec(type) {
  return {
    type, title: type, category: "databases", auth: { default: "userpass", by_auth: { userpass: { title: "Username & password", scopes: ["system"] } } },
    config: { properties: { host: { title: "Host", "ui:type": "string" }, port: { title: "Port", "ui:type": "number" }, database: { title: "Database", "ui:type": "string" }, schema: { title: "Schema", "ui:type": "string" } }, required: ["host", "database"] },
    credentials_by_auth: { userpass: { properties: { user: { title: "User", "ui:type": "string" }, password: { title: "Password", "ui:type": "password" } }, required: [] } },
  };
}

async function openForm(type, existing) {
  let spec;
  try { spec = await api("GET", "/catalog/" + encodeURIComponent(type)); }
  catch (e) { spec = genericSpec(type); }
  CUR_TYPE = type; CUR_SPEC = spec;
  const mode = (spec.auth && spec.auth.default) || Object.keys((spec.credentials_by_auth || {}))[0] || null;
  renderForm(spec, existing, mode);
}

function fieldKind(p) {
  const ui = p["ui:type"] || p.uiType || p.ui_type;
  if (ui) return ui;
  if (p.type === "integer" || p.type === "number") return "number";
  if (p.type === "boolean") return "boolean";
  if (p.type === "object") return "json";
  if (p.type === "array") return "stringlist";
  return "string";
}

function renderField(name, p, section, existing, credSet) {
  if (p["ui:hidden"] === true) return "";
  const kind = fieldKind(p);
  const title = p.title || name;
  const attrs = 'data-field="' + escapeAttr(name) + '" data-section="' + section + '" data-kind="' + kind + '"';
  // Config values prefill on edit; credential values never leave the agent, so
  // they only show a "set" placeholder.
  const cfgVal = (section === "config" && existing && existing.config && existing.config[name] != null) ? existing.config[name]
    : (existing ? null : p.default);
  const setPh = (section === "credentials" && credSet && credSet.includes(name)) ? "•••• (set)" : "";
  const desc = p.description ? '<div class="fhint">' + escapeHtml(p.description) + '</div>' : "";
  let input;
  switch (kind) {
    case "password":
      input = '<input type="password" autocomplete="new-password" ' + attrs + ' placeholder="' + escapeAttr(setPh) + '">'; break;
    case "number":
      input = '<input type="number" ' + attrs + (p.minimum != null ? ' min="' + p.minimum + '"' : "") + (p.maximum != null ? ' max="' + p.maximum + '"' : "") +
        ' value="' + (cfgVal != null ? escapeAttr(cfgVal) : "") + '">'; break;
    case "boolean":
      return '<div class="fld"><label class="chk"><input type="checkbox" ' + attrs + (cfgVal ? " checked" : "") + '> ' + escapeHtml(title) + '</label>' + desc + '</div>';
    case "textarea":
      input = '<textarea rows="3" ' + attrs + ' placeholder="' + escapeAttr(setPh) + '">' + (cfgVal != null && section === "config" ? escapeHtml(cfgVal) : "") + '</textarea>'; break;
    case "select": {
      const opts = p["ui:options"] || p.enum || [];
      const labels = p["ui:enumLabels"] || {};
      input = '<select ' + attrs + '>' + opts.map(o =>
        '<option value="' + escapeAttr(o) + '"' + (String(cfgVal) === String(o) ? " selected" : "") + '>' + escapeHtml(labels[o] != null ? labels[o] : o) + '</option>').join("") + '</select>';
      break;
    }
    case "keyvalue":
      input = '<textarea rows="2" ' + attrs + ' placeholder="key=value (one per line)">' +
        (cfgVal && typeof cfgVal === "object" ? escapeHtml(Object.entries(cfgVal).map(([k, v]) => k + "=" + v).join("\n")) : "") + '</textarea>'; break;
    case "json":
      input = '<textarea rows="3" ' + attrs + ' placeholder="{ }">' + (cfgVal != null ? escapeHtml(JSON.stringify(cfgVal, null, 1)) : "") + '</textarea>'; break;
    case "stringlist":
      input = '<textarea rows="2" ' + attrs + ' placeholder="one per line">' + (Array.isArray(cfgVal) ? escapeHtml(cfgVal.join("\n")) : "") + '</textarea>'; break;
    default:
      input = '<input type="text" ' + attrs + ' placeholder="' + escapeAttr(setPh) + '" value="' + (cfgVal != null && section === "config" ? escapeAttr(cfgVal) : "") + '">';
  }
  return '<div class="fld"><label>' + escapeHtml(title) + '</label>' + input + desc + '</div>';
}

function renderSection(schema, section, existing, credSet) {
  const props = (schema && schema.properties) || {};
  const html = Object.keys(props).map(n => renderField(n, props[n], section, existing, credSet)).join("");
  return html || '<div class="fhint">No fields.</div>';
}

function credsHtml(spec, mode, existing, credSet) {
  const cs = (spec.credentials_by_auth || {})[mode] || { properties: {} };
  const names = Object.keys(cs.properties || {});
  const core = {}, oauth = {};
  for (const n of names) { (n.startsWith("oauth_") ? oauth : core)[n] = cs.properties[n]; }
  let html = renderSection({ properties: core }, "credentials", existing, credSet);
  if (Object.keys(oauth).length) {
    html += '<details class="oauth"><summary>OAuth (optional)</summary>' +
      renderSection({ properties: oauth }, "credentials", existing, credSet) + '</details>';
  }
  if (!names.length) html = '<div class="fhint">This source needs no credentials.</div>';
  CUR_REQUIRED.credentials = cs.required || [];
  return html;
}

function renderForm(spec, existing, mode) {
  const isEdit = !!existing;
  const credSet = (existing && existing.credential_keys) || [];
  CUR_REQUIRED = { config: (spec.config && spec.config.required) || [], credentials: [] };
  const modes = Object.keys(spec.credentials_by_auth || {});
  const authSel = modes.length > 1
    ? '<div class="fld"><label>Authentication</label><select id="f_auth">' +
        modes.map(m => '<option value="' + escapeAttr(m) + '"' + (m === mode ? " selected" : "") + '>' +
          escapeHtml((spec.auth && spec.auth.by_auth && spec.auth.by_auth[m] && spec.auth.by_auth[m].title) || m) + '</option>').join("") +
      '</select></div>'
    : "";

  $("modalHost").innerHTML =
    '<div class="backdrop"><div class="modal modal-form">' +
    '<div class="row"><h3>' + (isEdit ? "Edit" : "Add") + " " + escapeHtml(spec.title || spec.type) + '</h3><button id="f_back">' + (isEdit ? "✕" : "‹ Back") + '</button></div>' +
    '<div class="modal-body">' +
      '<div class="hint">Credentials are stored encrypted on this agent and never sent to Bow.</div>' +
      '<div class="grid2">' +
        '<div class="fld"><label>Name</label><input id="f_name" ' + (isEdit ? "disabled" : 'placeholder="e.g. prod-pg"') + ' value="' + escapeAttr(existing ? existing.name : "") + '"></div>' +
        '<div class="fld"><label>Label <span class="opt">(optional)</span></label><input id="f_label" value="' + escapeAttr(existing ? (existing.label || "") : "") + '"></div>' +
      '</div>' +
      '<div class="sec">Configuration</div>' +
      renderSection(spec.config, "config", existing, credSet) +
      '<div class="sec">Credentials</div>' + authSel +
      '<div id="credsHost">' + credsHtml(spec, mode, existing, credSet) + '</div>' +
      '<div class="fld"><label>Query timeout <span class="opt">(seconds, optional)</span></label><input id="f_to" type="number" value="' + escapeAttr(existing && existing.query_timeout_seconds != null ? existing.query_timeout_seconds : "") + '"></div>' +
    '</div>' +
    '<div class="banner" id="f_banner"></div>' +
    '<div class="foot">' +
      '<button id="f_test">Test</button><div class="spacer"></div>' +
      '<button id="f_cancel">Cancel</button>' +
      '<button class="primary" id="f_save">' + (isEdit ? "Save" : "Create") + '</button>' +
    '</div>' +
    '</div></div>';

  $("f_back").onclick = isEdit ? closeForm : openPicker;
  $("f_cancel").onclick = closeForm;
  $("f_test").onclick = () => submitForm(isEdit, true);
  $("f_save").onclick = () => submitForm(isEdit, false);
  const auth = $("f_auth");
  if (auth) auth.onchange = () => { $("credsHost").innerHTML = credsHtml(spec, auth.value, existing, credSet); };
}

function closeForm() { $("modalHost").innerHTML = ""; }

function collectDynamic() {
  const config = {}, credentials = {};
  for (const el of document.querySelectorAll("[data-field]")) {
    const name = el.dataset.field, kind = el.dataset.kind;
    const target = el.dataset.section === "config" ? config : credentials;
    if (kind === "boolean") { target[name] = el.checked; continue; }
    const raw = el.value;
    if (kind === "number") { const s = String(raw).trim(); if (s === "") continue; const n = Number(s); if (!isNaN(n)) target[name] = n; continue; }
    if (kind === "select") { if (raw === "") continue; target[name] = /^-?\d+$/.test(raw) ? parseInt(raw, 10) : raw; continue; }
    if (kind === "keyvalue") { const o = {}; String(raw).split("\n").forEach(l => { const i = l.indexOf("="); if (i > 0) o[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }); if (Object.keys(o).length) target[name] = o; continue; }
    if (kind === "json") { const s = String(raw).trim(); if (s === "") continue; target[name] = JSON.parse(s); continue; }
    if (kind === "stringlist") { const arr = String(raw).split("\n").map(x => x.trim()).filter(Boolean); if (arr.length) target[name] = arr; continue; }
    const s = String(raw); if (s.trim() === "") continue; target[name] = s;   // string / password / textarea
  }
  return { config, credentials };
}

async function submitForm(isEdit, testOnly) {
  const banner = $("f_banner"); banner.className = "banner";
  let dyn;
  try { dyn = collectDynamic(); }
  catch (e) { banner.className = "banner err"; banner.textContent = "A JSON field is not valid: " + e.message; return; }
  const name = $("f_name").value.trim();
  if (!name) { banner.className = "banner err"; banner.textContent = "Name is required."; return; }
  const missing = (CUR_REQUIRED.config || []).filter(n => dyn.config[n] == null || dyn.config[n] === "");
  if (missing.length) { banner.className = "banner err"; banner.textContent = "Required: " + missing.join(", "); return; }

  const to = $("f_to").value.trim();
  const payload = { name, type: CUR_TYPE, label: ($("f_label").value.trim() || null), config: dyn.config, credentials: dyn.credentials, query_timeout_seconds: to ? parseInt(to, 10) : null };

  const testBtn = $("f_test"), saveBtn = $("f_save");
  testBtn.disabled = saveBtn.disabled = true;
  try {
    if (testOnly) {
      const r = await api("POST", "/test", payload);
      banner.className = "banner " + (r.success ? "ok" : "err");
      banner.textContent = (r.success ? "✓ " : "✗ ") + (r.message || (r.success ? "Connection ok" : "Test failed"));
    } else {
      if (isEdit) await api("PUT", "/connections/" + encodeURIComponent(payload.name), payload);
      else await api("POST", "/connections", payload);
      closeForm(); await refreshAll();
    }
  } catch (e) {
    banner.className = "banner err"; banner.textContent = e.message;
  } finally {
    testBtn.disabled = saveBtn.disabled = false;
  }
}

// ---- audit log ------------------------------------------------------------
async function refreshAudit() {
  const body = $("auditRows");
  try {
    const { entries } = await api("GET", "/audit?limit=200");
    if (!entries.length) { body.innerHTML = '<tr><td colspan="7" class="empty">No operations recorded yet.</td></tr>'; return; }
    body.innerHTML = entries.map(e => {
      const rows = e.row_count != null ? e.row_count : "—";
      const dur = e.duration_ms != null ? e.duration_ms + " ms" : "—";
      const detail = e.error ? '<span class="result err">' + escapeHtml(e.error) + '</span>' : (e.sql ? escapeHtml(e.sql) : "");
      return '<tr>' +
        '<td title="' + escapeAttr(e.ts) + '">' + escapeHtml(fmtTime(e.ts)) + '</td>' +
        '<td>' + escapeHtml(e.connection || "—") + '</td>' +
        '<td>' + escapeHtml(e.operation) + '</td>' +
        '<td class="num">' + escapeHtml(rows) + '</td>' +
        '<td class="num">' + escapeHtml(dur) + '</td>' +
        '<td><span class="badge ' + escapeHtml(e.outcome) + '">' + escapeHtml(e.outcome) + '</span></td>' +
        '<td class="sql" title="' + escapeAttr(e.error || e.sql || "") + '">' + detail + '</td>' +
      '</tr>';
    }).join("");
  } catch (e) {
    body.innerHTML = '<tr><td colspan="7" class="empty">Failed to load: ' + escapeHtml(e.message) + '</td></tr>';
  }
}

function fmtTime(iso) {
  try { const d = new Date(iso); return d.toLocaleString(undefined, { hour12: false }); }
  catch (e) { return iso; }
}

function showPanel(name) {
  for (const t of document.querySelectorAll(".tab")) t.classList.toggle("active", t.dataset.panel === name);
  $("panelConnections").hidden = name !== "connections";
  $("panelAudit").hidden = name !== "audit";
  if (name === "audit") refreshAudit();
}

// ---- utils ----------------------------------------------------------------
function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, "&quot;"); }

async function refreshAll() { await Promise.all([refreshStatus(), refreshList()]); }

(async function init() {
  $("addBtn").onclick = openPicker;
  $("auditRefresh").onclick = refreshAudit;
  for (const t of document.querySelectorAll(".tab")) t.onclick = () => showPanel(t.dataset.panel);
  try { ICONS = (await api("GET", "/icons")).icons || {}; } catch (e) { ICONS = {}; }
  await refreshAll();
  setInterval(refreshStatus, 5000);
})();
</script>
</body>
